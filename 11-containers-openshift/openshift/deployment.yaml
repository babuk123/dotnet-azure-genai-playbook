apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels: { app: orders-api }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # zero-downtime rollout
  selector:
    matchLabels: { app: orders-api }
  template:
    metadata:
      labels: { app: orders-api }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/banking/orders-api:1.0.0
          ports: [{ containerPort: 8080 }]
          env:
            - name: ConnectionStrings__Db
              valueFrom: { secretKeyRef: { name: orders-db, key: connection } }
          envFrom:
            - configMapRef: { name: orders-api-config }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata: { name: orders-api }
spec:
  selector: { app: orders-api }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: { name: orders-api }
spec:
  to: { kind: Service, name: orders-api }
  port: { targetPort: 8080 }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: orders-api-config }
data:
  ASPNETCORE_ENVIRONMENT: Production
  Logging__LogLevel__Default: Information
