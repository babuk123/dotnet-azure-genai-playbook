# Used by the generic SonarScanner; .NET projects usually use `dotnet sonarscanner begin/end` (see Jenkinsfile)
sonar.projectKey=orders-api
sonar.sources=.
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**
sonar.coverage.exclusions=**/Program.cs,**/*Tests*/**
sonar.cs.opencover.reportsPaths=TestResults/**/coverage.opencover.xml
# Quality gate (configured on the server): new code coverage ≥ 80%, no new bugs/vulnerabilities, duplication < 3%
