# Build, test, scan, push image, then deploy to AKS with blue-green (staging slot) or canary
trigger:
  branches: { include: [main] }

variables:
  imageRepo: orders-api
  acr: myacr.azurecr.io
  tag: $(Build.BuildId)

stages:
  - stage: Build
    jobs:
      - job: build
        pool: { vmImage: ubuntu-latest }
        steps:
          - task: UseDotNet@2
            inputs: { packageType: sdk, version: 8.0.x }
          - script: dotnet test --configuration Release --collect "XPlat Code Coverage"
            displayName: Unit tests
          - task: Docker@2
            displayName: Build and push image
            inputs:
              containerRegistry: acr-connection
              repository: $(imageRepo)
              command: buildAndPush
              Dockerfile: 11-containers-openshift/Dockerfile
              buildContext: $(Build.SourcesDirectory)
              tags: $(tag)

  - stage: Canary
    dependsOn: Build
    jobs:
      - deployment: canary
        environment: prod-aks.orders     # approvals + checks configured on the environment
        pool: { vmImage: ubuntu-latest }
        strategy:
          canary:
            increments: [10, 50]
            deploy:
              steps:
                - task: KubernetesManifest@1
                  inputs:
                    action: deploy
                    strategy: canary
                    percentage: $(strategy.increment)
                    manifests: 13-aks/workload-identity.yaml
                    containers: $(acr)/$(imageRepo):$(tag)
            postRouteTraffic:
              pool: server
              steps:
                - task: Delay@1          # bake time: watch errors/latency in App Insights
                  inputs: { delayForMinutes: '10' }
            on:
              failure:
                steps:
                  - task: KubernetesManifest@1
                    inputs: { action: reject, strategy: canary, manifests: 13-aks/workload-identity.yaml }
              success:
                steps:
                  - task: KubernetesManifest@1
                    inputs: { action: promote, strategy: canary, manifests: 13-aks/workload-identity.yaml,
                              containers: $(acr)/$(imageRepo):$(tag) }
